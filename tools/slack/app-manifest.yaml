display_information:
  name: LocalBrain
  description: LocalBrain local-only OCR and assistant
  background_color: "#18263c"
features:
  bot_user:
    display_name: LocalBrain
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - chat:write
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
